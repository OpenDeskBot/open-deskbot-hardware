; Deskbot ESP32-S3 v2.0.1 — 在 deskbot-rom/ 目录执行: pio run
; 烧录: ./flash_rom.sh all [/dev/ttyUSB0]

[platformio]
src_dir = firmware
extra_configs =
	deskbot_build.local.ini

[env:esp32s3_v2_0_1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 启用 PSRAM：asr_chat 大段 WS 下行缓冲宜放 PSRAM
build_flags =
	-DBOARD_HAS_PSRAM
	-DWEBSOCKETS_MAX_DATA_SIZE=4194304
	'-DASR_CHAT_HOST=""'
	-DASR_CHAT_PORT=9000
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
board_build.partitions = noota_ffat.csv
; WebSockets 放在前面，避免部分环境下 LDF 找不到 WiFi.h（见 arduinoWebSockets #956）
lib_deps =
	links2004/WebSockets@^2.4.1
	adafruit/Adafruit SSD1306
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson@^7
	madhephaestus/ESP32Servo
	adafruit/Adafruit NeoPixel
