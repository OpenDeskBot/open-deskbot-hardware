; Deskbot Camera — Seeed XIAO ESP32S3 Sense
; Flash: ./flash_camera.sh all [/dev/ttyACM0]

[platformio]
src_dir = firmware
extra_configs =
	deskbot_build.local.ini

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; WebSockets + 人脸检测固件较大，8MB Flash 用 max_app 分区（约 7.9MB APP）
board_build.partitions = max_app_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  '-DDESKBOT_WS_HOST=""'
  -DDESKBOT_WS_PORT=9000
  -DDESKBOT_CAMERA_UPLOAD_JPEG=1
  -DDESKBOT_CAMERA_LOCAL_FACE_DETECT=1
  -DDESKBOT_CAMERA_UPLOAD_FPS=10
  -DDESKBOT_CAMERA_FACE_DETECT_FPS=5
lib_deps =
  links2004/WebSockets@^2.6.1
