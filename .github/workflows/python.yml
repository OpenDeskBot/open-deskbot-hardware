name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate flash script syntax
        run: |
          bash -n deskbot-rom/flash_rom.sh
          bash -n deskbot-camera/flash_camera.sh

      - name: Block tracked virtualenv artifacts
        run: |
          set -e
          if git ls-files '.venv' | grep -q .; then
            echo "::error::Tracked .venv paths found"
            exit 1
          fi
          if git ls-files | grep -E '__pycache__|\.pyc$' | grep -q .; then
            echo "::error::Tracked __pycache__ or .pyc files found"
            exit 1
          fi
